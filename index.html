<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katalog</title>
<meta name="description" content="Katalog: training log for lifting, climbing, hangs and tendon work. Works offline; data stays on this device.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceff2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Katalog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800;1,900&family=Public+Sans:wght@400;500;600&family=Shippori+Mincho+B1:wght@600;700;800&family=Yuji+Syuku&family=Press+Start+2P&family=Bitter:wght@600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/skins.css">
<script type="module" src="src/main.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1><span class="skinmark" aria-hidden="true"></span>Katalog</h1><div class="row" style="gap:8px"><span class="mode" id="mode">Loading…</span><button class="btn small" data-act="cycleskin" id="skinbtn" aria-label="Change skin">Skin</button></div></div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
      <button role="tab" data-tab="log" aria-selected="false">Log</button>
      <button role="tab" data-tab="history" aria-selected="false">History</button>
      <button role="tab" data-tab="progress" aria-selected="false">Stats</button>
      <button role="tab" data-tab="build" aria-selected="false">Build</button>
      <button role="tab" data-tab="method" aria-selected="false">Method</button>
      <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="livebar" id="livebar" hidden></div>
<div id="tip" hidden></div>
<noscript><p style="padding:16px">Katalog needs JavaScript.</p></noscript>
</body>
</html>
